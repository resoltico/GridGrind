org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
gridgrindJavaVersion=27
gridgrindJavaTargetVersion=26
group=dev.erst.gridgrind
version=0.0.0-dev
gridgrindDescription=Structured .xlsx workbook automation engine with an agent-friendly JSON protocol

# google-java-format uses the documented javac compiler APIs in the build JVM.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
