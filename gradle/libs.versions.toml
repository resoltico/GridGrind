[versions]
kotlin = "2.4.21"
archunit = "1.5.1"
junit-jupiter = "6.1.3"
junit-platform-launcher = "6.1.3"
junit-bom = "6.1.3"
jackson-databind = "3.2.4"
json-schema-validator = "3.0.8"
# Jackson 3.x keeps annotations on the Jackson 2.x coordinates and package namespace by design.
jackson-annotations = "2.22"
log4j = "2.26.1"
poi-ooxml = "6.0.0"
jqf = "3.0"
bouncycastle = "1.86"
bouncycastle-pkix = "1.86"
# Santuario xmlsec 4.x declares transitive JPMS requires on these APIs while publishing them as
# provided dependencies, so GridGrind must own them explicitly for modular compile/runtime use.
jakarta-activation = "2.1.4"
jakarta-xml-bind = "4.0.5"
xmlsec = "4.0.4"
slf4j = "2.0.20"
errorprone = "2.51.0"
errorprone-plugin = "5.1.1"
jspecify = "1.0.1"
nullaway = "0.14.3"
google-java-format = "1.37.0"
jacoco = "0.8.16"
pmd = "7.28.0"
pitest = "1.30.1"
pitest-gradle-plugin = "1.19.0"
pitest-junit5-plugin = "1.2.3"
shadow = "9.6.1"
spotless = "8.10.4"

commons-lang3 = "3.21.0"
woodstox-core = "7.3.0"
stax2-api = "4.3.2"

asm = "9.11.1"
picocli = "4.7.7"
eclipse-collections = "13.0.0"
jackson-tooling = "2.22.4"

[libraries]
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
eclipse-collections = { module = "org.eclipse.collections:eclipse-collections", version.ref = "eclipse-collections" }
eclipse-collections-api = { module = "org.eclipse.collections:eclipse-collections-api", version.ref = "eclipse-collections" }
jackson-tooling-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson-tooling" }
jackson-tooling-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson-tooling" }
jacoco-report = { module = "org.jacoco:org.jacoco.report", version.ref = "jacoco" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
woodstox-core = { module = "com.fasterxml.woodstox:woodstox-core", version.ref = "woodstox-core" }
stax2-api = { module = "org.codehaus.woodstox:stax2-api", version.ref = "stax2-api" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle-pkix" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle-pkix" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
jakarta-activation = { module = "jakarta.activation:jakarta.activation-api", version.ref = "jakarta-activation" }
jakarta-xml-bind = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "jakarta-xml-bind" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson-databind" }
jqf-core = { module = "edu.berkeley.cs.jqf:jqf-core", version.ref = "jqf" }
jqf-instrument = { module = "edu.berkeley.cs.jqf:jqf-instrument", version.ref = "jqf" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi-ooxml" }
poi-ooxml-full = { module = "org.apache.poi:poi-ooxml-full", version.ref = "poi-ooxml" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
xmlsec = { module = "org.apache.santuario:xmlsec", version.ref = "xmlsec" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[bundles]
jqf-tooling = ["jqf-core", "jqf-instrument", "asm", "asm-commons", "asm-tree", "picocli", "eclipse-collections", "eclipse-collections-api", "jackson-tooling-core", "jackson-tooling-databind", "jacoco-report"]
