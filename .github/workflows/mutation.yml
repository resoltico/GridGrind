name: Mutation testing

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mutation.yml'
      - 'check_mutation.sh'
      - 'gradle/libs.versions.toml'
      - 'gradle/build-logic/**'
      - 'contract/build.gradle.kts'
      - 'contract/src/**'
      - 'engine/build.gradle.kts'
      - 'engine/src/**'
      - 'cli/build.gradle.kts'
      - 'cli/src/**'
      - 'executor/build.gradle.kts'
      - 'executor/src/**'
      - 'scripts/test-check-mutation.sh'
      - 'scripts/repo-verification-lock-support.sh'
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Critical mutation scopes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '26'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run critical mutation scopes
        run: ./check_mutation.sh
      - name: Retain mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-reports
          path: |
            contract/build/reports/pitest
            engine/build/reports/pitest
            cli/build/reports/pitest
            executor/build/reports/pitest
          if-no-files-found: error
          retention-days: 30
