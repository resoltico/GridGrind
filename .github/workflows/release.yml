name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a candidate or publish an independently accepted artifact pair
        type: choice
        required: true
        options: [prepare, publish-prepared]
      version:
        description: Stable version, without v
        type: string
        required: true
      source_commit:
        description: Exact protected main and workflow commit
        type: string
        required: true
      candidate_run_id:
        description: Reviewed preparation run ID (publication only)
        type: string
      candidate_run_attempt:
        description: Reviewed preparation attempt (publication only)
        type: string
      delivery_artifact_id:
        description: Exact immutable delivery artifact ID (publication only)
        type: string
      delivery_artifact_digest:
        description: Delivery service digest, sha256 followed by colon and hex (publication only)
        type: string
      candidate_manifest_sha256:
        description: Reviewed candidate.json digest (publication only)
        type: string
      qa_artifact_id:
        description: Exact immutable QA receipt artifact ID (publication only)
        type: string
      qa_artifact_digest:
        description: QA receipt service digest (publication only)
        type: string
      qa_receipt_sha256:
        description: Reviewed artifact-qa.json digest (publication only)
        type: string
      reviewed_pair_sha256:
        description: Canonical reviewed pair digest (publication only)
        type: string
      independent_acceptance:
        description: JSON acknowledgement binding independent QA evidence to the exact pair and JAR (publication only)
        type: string
      independent_acceptance_sha256:
        description: Canonical independent acknowledgement digest (publication only)
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gridgrind-public-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  RELEASE_WORKFLOW_COMMIT: ${{ github.workflow_sha }}

jobs:
  prepare:
    name: Prepare candidate
    if: inputs.operation == 'prepare'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    outputs:
      delivery-id: ${{ steps.delivery.outputs.artifact-id }}
    steps:
      - name: Require a main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Bind the untagged protected main source before expensive work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release_delivery.py begin --version "$VERSION" --source "$SOURCE_COMMIT"
      - uses: ./.github/actions/setup-temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-cleanup: always
          cache-read-only: true
      - name: Read the qualified Docker server pin
        id: docker-version
        shell: bash
        run: |
          set -euo pipefail
          source release/transfer-tools.properties
          printf 'version=v%s\n' "$DOCKER_SERVER_VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: ${{ steps.docker-version.outputs.version }}
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - name: Exercise release-control failure boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests 2>&1 | tee build/release-work/control-tests.log
      - name: Check and build the exact versioned delivery
        shell: bash
        run: |
          set -euo pipefail
          ./check.sh prepareReleaseNotes "-Pversion=$VERSION" --no-build-cache 2>&1 | tee build/release-work/check.log
      - name: Exercise bounded active fuzzing
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew fuzz -Pharness=protocol-request -PfuzzSeconds=10 -PfuzzRuns=1000 "-Pversion=$VERSION" 2>&1 | tee build/release-work/active-fuzz.log
      - name: Exercise a bounded mutation control
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :core:pitest -PmutationClasses=dev.erst.gridgrind.core.vocabulary.RgbHex -PmutationTests=dev.erst.gridgrind.core.vocabulary.RgbHexTest -PmutationMutators=NEGATE_CONDITIONALS --max-workers=1 "-Pversion=$VERSION" 2>&1 | tee build/release-work/bounded-pit.log
      - name: Derive the resolved runtime component inventory
        run: ./gradlew :cli:writeRuntimeComponentInventory "-Pversion=$VERSION"
      - name: Build and verify both retained image platforms and corresponding sources
        run: python3 -B scripts/release_delivery.py assemble --components cli/build/runtime-component-inventory.json --component-files cli/build/runtime-component-files.json
      - name: Seal completed artifact QA and immutable payload inventory
        run: python3 -B scripts/release_delivery.py seal
      # These are CI candidates visible to authenticated artifact readers. No tag,
      # release or registry image exists until the separately dispatched publisher.
      - name: Retain the validated delivery candidate
        id: delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-candidate/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain preparation failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepare-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-work/*.log
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            build/reports/configuration-cache/**
          if-no-files-found: warn
          retention-days: 7

  qa-receipt:
    name: Bind candidate QA receipt
    needs: prepare
    if: inputs.operation == 'prepare'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Require a main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download and bind the exact delivery service artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_ID: ${{ needs.prepare.outputs.delivery-id }}
        run: python3 -B scripts/release_pair.py receipt --repo "$GITHUB_REPOSITORY" --version "$VERSION" --source "$SOURCE_COMMIT" --delivery-id "$DELIVERY_ID" --download "$RUNNER_TEMP/delivery-check" --output build/artifact-qa
      - name: Retain the immutable service binding receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-qa-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifact-qa/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish reviewed artifacts
    if: inputs.operation == 'publish-prepared'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Require a main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Install the qualified OCI copy client
        run: python3 -B scripts/release_oci.py install --pins release/transfer-tools.properties --output "$RUNNER_TEMP/release-tools/regctl"
      - name: Publish the independently accepted immutable pair without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          REGCTL_CONFIG: ${{ runner.temp }}/release-tools/regctl-config.json
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          DELIVERY_ID: ${{ inputs.delivery_artifact_id }}
          DELIVERY_DIGEST: ${{ inputs.delivery_artifact_digest }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          QA_ID: ${{ inputs.qa_artifact_id }}
          QA_DIGEST: ${{ inputs.qa_artifact_digest }}
          QA_RECEIPT_SHA256: ${{ inputs.qa_receipt_sha256 }}
          REVIEWED_PAIR_SHA256: ${{ inputs.reviewed_pair_sha256 }}
          INDEPENDENT_ACCEPTANCE: ${{ inputs.independent_acceptance }}
          INDEPENDENT_ACCEPTANCE_SHA256: ${{ inputs.independent_acceptance_sha256 }}
        run: |
          python3 -B scripts/publish_prepared.py --version "$VERSION" --source "$SOURCE_COMMIT" \
            --run-id "$CANDIDATE_RUN_ID" --attempt "$CANDIDATE_RUN_ATTEMPT" \
            --delivery-id "$DELIVERY_ID" --delivery-digest "$DELIVERY_DIGEST" --candidate-sha "$CANDIDATE_MANIFEST_SHA256" \
            --qa-id "$QA_ID" --qa-digest "$QA_DIGEST" --receipt-sha "$QA_RECEIPT_SHA256" \
            --pair-sha "$REVIEWED_PAIR_SHA256" --acceptance-sha "$INDEPENDENT_ACCEPTANCE_SHA256" \
            --download "$RUNNER_TEMP/reviewed-release" --client "$RUNNER_TEMP/release-tools/regctl"
      - name: Retain publication receipts and failure state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/publication-receipt.json
            build/publication-*.json
          if-no-files-found: warn
          retention-days: 30
