name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version of an existing vX.Y.Z tag to verify
        required: true
        type: string
      dry_run:
        description: Build and verify without publishing or pruning
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '27.0.1'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-cleanup: always
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Derive version and require its CHANGELOG section
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            version="${REQUESTED_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          ./gradlew prepareReleaseNotes "-Pversion=${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gridgrind" >> "$GITHUB_OUTPUT"
      - name: Check and build delivery archives
        run: ./check.sh "-Pversion=${{ steps.release.outputs.version }}"
      - name: Verify actual container behavior
        run: ./gradlew containerTest "-Pversion=${{ steps.release.outputs.version }}"
      - name: Publish GitHub release and exact verified artifacts
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${RELEASE_VERSION}" --verify-tag \
            --title "GridGrind ${RELEASE_VERSION}" --notes-file build/release-notes.md \
            cli/build/libs/gridgrind.jar \
            "cli/build/distributions/gridgrind-${RELEASE_VERSION}.zip" \
            "cli/build/distributions/gridgrind-${RELEASE_VERSION}.tar"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name == 'push' || !inputs.dry_run
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push' || !inputs.dry_run
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: github.event_name == 'push' || !inputs.dry_run
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          build-args: GRIDGRIND_VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    name: Prune old container versions
    runs-on: ubuntu-26.04
    needs: release
    if: needs.release.result == 'success' && (github.event_name == 'push' || !inputs.dry_run)
    timeout-minutes: 5

    permissions:
      packages: write

    steps:
      # Retain complete multi-platform release groups through the package-versions API.
      #
      # A GHCR multi-arch release is not a single package-version record. The tagged OCI index is
      # accompanied by multiple untagged records, including platform manifests and provenance or
      # attestation manifests. Raw count-based pruning therefore keeps the wrong number of releases
      # and can split a release across the retention boundary.
      #
      # The safe rule is to anchor retention on the five newest tagged releases (tags matching
      # X.Y.Z), then keep every package-version record created at or after the 5th newest anchor.
      # That preserves complete release groups even if GitHub changes how many untagged records a
      # release produces in the future.
      - name: Prune package versions older than the five newest tagged releases
        shell: bash
        env:
          API_VERSION: 2026-03-10
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: gridgrind
          PACKAGE_TYPE: container
          RELEASES_TO_KEEP: "5"
        run: |
          set -euo pipefail

          owner_type="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "/users/${OWNER}" \
            --jq '.type')"

          case "${owner_type}" in
            Organization)
              versions_endpoint="/orgs/${OWNER}/packages/${PACKAGE_TYPE}/${PACKAGE_NAME}/versions"
              ;;
            User)
              versions_endpoint="/users/${OWNER}/packages/${PACKAGE_TYPE}/${PACKAGE_NAME}/versions"
              ;;
            *)
              echo "Unsupported package owner type: ${owner_type}" >&2
              exit 1
              ;;
          esac

          versions_json="$(gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "${versions_endpoint}?per_page=100")"

          release_anchors_json="$(printf '%s' "${versions_json}" | jq \
            --argjson releasesToKeep "${RELEASES_TO_KEEP}" '
              map(.[]) |
              [
                .[]
                | {
                    id,
                    createdAt: .created_at,
                    tags: (.metadata.container.tags // []),
                    releaseTag: (
                      (.metadata.container.tags // [])
                      | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
                      | first
                    )
                  }
                | select(.releaseTag != null)
              ]
              | sort_by(.createdAt)
              | reverse
              | .[:$releasesToKeep]
            ')"

          release_anchor_count="$(printf '%s' "${release_anchors_json}" | jq 'length')"
          if [ "${release_anchor_count}" -lt "${RELEASES_TO_KEEP}" ]; then
            echo "Found ${release_anchor_count} tagged releases; fewer than ${RELEASES_TO_KEEP} exist, so nothing is pruned."
            exit 0
          fi

          cutoff_created_at="$(printf '%s' "${release_anchors_json}" | jq -r 'last.createdAt')"
          echo "Keeping complete package-version groups for these tagged releases:"
          printf '%s' "${release_anchors_json}" | jq -r '.[] | "  - \(.releaseTag) anchored at \(.createdAt) (package version id \(.id))"'

          deletion_candidates_json="$(printf '%s' "${versions_json}" | jq \
            --arg cutoffCreatedAt "${cutoff_created_at}" '
              map(.[]) |
              [
                .[]
                | select(.created_at < $cutoffCreatedAt)
                | {
                    id,
                    createdAt: .created_at,
                    tags: (
                      if (.metadata.container.tags // []) | length == 0
                      then ["<untagged>"]
                      else (.metadata.container.tags // [])
                      end
                    )
                  }
              ]
            ')"

          deletion_count="$(printf '%s' "${deletion_candidates_json}" | jq 'length')"
          if [ "${deletion_count}" -eq 0 ]; then
            echo "No package versions are older than the retained release cutoff."
            exit 0
          fi

          echo "Deleting ${deletion_count} package versions older than ${cutoff_created_at}:"
          printf '%s' "${deletion_candidates_json}" | jq -r '.[] | "  - id \(.id) created \(.createdAt) tags=\(.tags | join(","))"'

          printf '%s' "${deletion_candidates_json}" | jq -r '.[].id' | while IFS= read -r version_id; do
            gh api \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "${versions_endpoint}/${version_id}"
          done
